[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# EntryPoint v0.8 and the Dojang contracts target 0.8.28; GIWA Sepolia runs Prague (OP Stack Isthmus).
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 1_000_000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./deployments" }]

[fuzz]
runs = 1024

[rpc_endpoints]
giwa_sepolia = "https://sepolia-rpc.giwa.io"

[etherscan]
giwa_sepolia = { key = "unused", url = "https://sepolia-explorer.giwa.io/api", chain = 91342 }
